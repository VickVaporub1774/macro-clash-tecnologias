<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MACRO-CLASH: Camino al Olimpo del Gym</title>
<style>
:root{--bg:#0d0f12;--pn:#171b21;--ln:#2a313b;--g:#39ff6a;--o:#ff8a1f;--r:#ff4d4d;--t:#e8edf2;--m:#8c97a4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 ui-monospace,Consolas,monospace}
#app{max-width:880px;margin:auto;padding:10px}header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font:900 clamp(18px,4vw,28px) Impact,'Arial Black',sans-serif;letter-spacing:1px;margin:0;color:var(--g);text-shadow:2px 2px var(--o)}
h2{margin:0 0 6px;color:var(--o)}small{color:var(--m)}
button{font:inherit;font-weight:700;background:var(--pn);color:var(--t);border:2px solid var(--ln);padding:8px 12px;cursor:pointer;border-radius:4px}
button:hover:not(:disabled){border-color:var(--g)}button:focus-visible{outline:2px solid var(--o)}button:disabled{opacity:.4;cursor:not-allowed}
.pri{background:var(--g);color:#000;border-color:var(--g)}.or{background:var(--o);color:#000;border-color:var(--o)}
canvas{width:100%;display:block;image-rendering:pixelated;border:3px solid var(--ln);background:#000;margin:8px 0;touch-action:manipulation}
#stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:6px}.st{background:var(--pn);padding:4px 6px;border-radius:4px;font-size:12px}
.bar{height:8px;background:#000;margin-top:3px}.bar i{display:block;height:100%;transition:width .4s}
#panel{background:var(--pn);border:2px solid var(--ln);padding:12px;border-radius:6px;margin-top:8px}
#fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:8px 0}
.fd{text-align:left;font-size:12px}.fd.on{border-color:var(--g);background:#12301c}
.tag{display:inline-block;padding:2px 6px;border-radius:3px;font-size:12px;margin:2px}.good{background:#12301c;color:var(--g)}.bad{background:#3a1616;color:var(--r)}
.blk{display:block;width:100%;text-align:left;margin:5px 0}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
#log{font-size:12px;color:var(--m);min-height:50px;margin-top:6px}
</style></head><body><div id="app">
<header><h1>MACRO-CLASH <small>Camino al Olimpo del Gym</small></h1><div><b id="day"></b> <button id="mu" aria-label="Silenciar">🔊</button></div></header>
<canvas id="cv" width="320" height="180"></canvas><div id="stats"></div><div id="panel"></div></div>
<script>
const $=i=>document.getElementById(i),cv=$('cv'),x=cv.getContext('2d');x.imageSmoothingEnabled=false;
const GO={mus:{n:'Ganancia muscular',k:2300,p:160,c:290,f:70,d:'Más carbohidratos y calorías para construir fuerza.'},rec:{n:'Recomposición corporal',k:1700,p:150,c:170,f:55,d:'Proteína alta y calorías moderadas: más músculo, menos grasa.'},res:{n:'Resistencia atlética',k:2100,p:110,c:330,f:60,d:'Muchos carbohidratos para aguantar rondas largas.'}};
// [emoji,nombre,kcal,P,C,G,chatarra]
const F=[['🍗','Pechuga de pollo 300 g',495,93,0,11],['🍚','Arroz integral 2 tazas',430,10,90,4],['🍳','Huevos revueltos (5)',460,32,3,34],['🥣','Avena con plátano grande',520,15,95,9],['🥑','Aguacate (2)',480,6,26,44],['🐟','Salmón 250 g',520,56,0,30],['🍕','Pizza grasosa (4 reb.)',1000,38,115,45,1],['🥤','Refresco 1 L',420,0,106,0,1],['⚡','Bebida energética (2)',440,0,110,0,1],['🥗','Ensalada mixta con aceite',180,4,18,11],['🫘','Frijoles con tortillas',560,22,100,7],['🥛','Yogur griego con fruta',380,24,50,9],['🥔','Papa al horno (3)',480,12,108,0],['🥫','Atún (3 latas) con pan',520,60,40,9],['🍔','Hamburguesa doble + papas',1150,50,100,62,1]];
const SN=[['STR','Fuerza','#ff8a1f'],['STA','Resistencia','#39ff6a'],['REC','Recuperación','#4db8ff'],['ENG','Energía','#ffd84d'],['HP','Salud metab.','#ff6b9a']];
const EVD=[3,5,8,10,13];
const EV=[
['📱 El polvo mágico del influencer','Un influencer jura que su polvo te marca el abdomen en 3 días. Cuesta $900.',[['Comprarlo',{HP:-6,ENG:-5},0,'No existe la pérdida de grasa localizada ni el abdomen en 3 días. Esos polvos suelen ser diuréticos, laxantes o estimulantes: pierdes agua, no grasa.'],['Ignorarlo y seguir tu plan',{HP:5,REC:3},1,'La grasa abdominal baja con déficit calórico sostenido, proteína suficiente, fuerza y sueño. Ningún polvo lo reemplaza.'],['Consultar a un nutriólogo certificado',{HP:4,STR:2,REC:2},1,'Un profesional ajusta el plan a tu cuerpo y evita que gastes en promesas sin evidencia.']]],
['📚 Examen mañana','Tienes examen y quieres tomar 3 bebidas energéticas sin dormir.',[['Tomarlas y estudiar toda la noche',{REC:-8,HP:-5,ENG:-8},0,'La cafeína no sustituye al sueño: sin dormir se consolida peor la memoria y se eleva el cortisol, lo que frena la recuperación muscular.'],['Dormir 7-8 h y repasar temprano',{REC:7,HP:3,ENG:5},1,'Dormir consolida lo aprendido y libera hormona de crecimiento, clave para recuperarte.'],['Una bebida y dormir 4 h',{REC:-3,ENG:-2},0,'Es un punto medio, pero dormir tan poco sigue afectando recuperación y rendimiento.']]],
['🥩 "Solo proteína, cero carbos"','Un amigo presume su dieta sin carbohidratos y te reta a imitarla.',[['Aceptar el reto',{STA:-5,ENG:-10},0,'Sin carbohidratos se vacía el glucógeno: menos energía, mal ánimo y menos rendimiento en entrenamientos intensos.'],['Explicarle que los carbos son combustible',{STA:3,ENG:5,HP:2},1,'Los carbohidratos reponen glucógeno muscular. La proteína repara; no es la fuente principal de energía.']]],
['🎂 Cumpleaños con pizza y refresco','Hay pizza, pastel y refresco ilimitado.',[['Comer sin control',{HP:-5,STA:-4},0,'Un día no arruina tu progreso, pero el exceso de grasa y azúcar simples genera pesadez y picos de glucosa.'],['Porción moderada y a bailar',{HP:3,STA:2},1,'Equilibrio: disfrutas sin culpa y mantienes el hábito. La consistencia importa más que la perfección.'],['No comer en todo el día para compensar',{ENG:-8,HP:-3},0,'Saltarte comidas suele terminar en atracones y baja tu energía de entrenamiento.']]],
['🦵 Agujetas fuertes','Te duelen las piernas muchísimo y quieres entrenarlas igual.',[['Entrenar al límite de todos modos',{REC:-6,STR:-2},0,'Entrenar un músculo sin recuperarse acumula fatiga y aumenta el riesgo de lesión. El músculo crece al descansar.'],['Descanso activo, proteína y sueño',{REC:7,HP:2},1,'Caminar suave, comer proteína y dormir bien aceleran la reparación muscular.'],['Antiinflamatorio todos los días',{HP:-5,REC:-2},0,'Abusar de antiinflamatorios daña estómago y riñón, y puede limitar la adaptación al entrenamiento.']]]];
let S,T,goal,day,sel=[],D,mode='title',act=null,tm=null,B=null,ft=[],aT=0,sh=0,lg=0,bl=0,mute=false,mus=null,AC=null;
function reset(){S={STR:10,STA:10,REC:10,ENG:50,HP:50};T={c:0,p:0,j:0,ok:0,ev:0,evn:0,rest:0};day=1;sel=[];ft=[];}
// ---------- AUDIO ----------
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function bp(f,d=.1,t='square',v=.06,s=0,dl=0){if(mute)return;const a=au();if(!a)return;try{const o=a.createOscillator(),g=a.createGain(),n=a.currentTime+dl;o.type=t;o.frequency.setValueAtTime(f,n);if(s)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+s),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(a.destination);o.start(n);o.stop(n+d)}catch(e){}}
const SFX={click:()=>bp(660,.05),hit:()=>{bp(520,.08,'square',.07,300);bp(780,.1,'square',.07,0,.07)},miss:()=>bp(160,.2,'sawtooth',.07,-80),up:()=>[523,659,784,1046].forEach((f,i)=>bp(f,.12,'square',.06,0,i*.09)),alert:()=>{bp(300,.1,'sawtooth');bp(300,.1,'sawtooth',.06,0,.15)},lift:()=>bp(110,.15,'triangle',.1,60),hurt:()=>bp(200,.2,'sawtooth',.08,-120)};
function music(ms){clearInterval(mus);let i=0;const n=[110,0,110,165,147,0,147,196,131,0,131,196,123,0,165,147];mus=setInterval(()=>{const f=n[i++%16];if(f)bp(mode==='battle'?f*2:f,.18,'triangle',.05)},ms)}
$('mu').onclick=()=>{mute=!mute;$('mu').textContent=mute?'🔇':'🔊';if(!mute){au();SFX.click()}};
// ---------- UI ----------
function ups(){$('stats').innerHTML=SN.map(([k,n,c])=>`<div class="st">${n} <b>${Math.round(S[k])}</b><div class="bar"><i style="width:${S[k]}%;background:${c}"></i></div></div>`).join('');$('day').textContent=mode==='title'?'':day>14?'Día 15 · BATALLA':`Día ${day}/14`}
function fl(t,c,px=95,py=95){ft.push({t,c,x:px,y:py,l:70})}
function gain(k,v){const o=S[k];S[k]=Math.max(0,Math.min(100,o+v));const d=Math.round(S[k]-o);if(d)fl((d>0?'+':'')+d+' '+k,d>0?'#39ff6a':'#ff4d4d',70+Math.random()*50,85);if(Math.floor(S[k]/25)>Math.floor(o/25)){SFX.up();fl('¡NIVEL!','#ffd84d',95,60)}ups()}
function P(h){$('panel').innerHTML=h}
function title(){mode='title';act=null;reset();ups();P(`<h2>Elige tu objetivo</h2><p>Enfrenta a <b>Braulio "El Ciclado" Broscience</b> en 14 días de preparación + 1 batalla final. Tu dieta decide cómo entrenas.</p>
${Object.keys(GO).map(k=>`<button class="blk" data-g="${k}"><b>${GO[k].n}</b> — ${GO[k].k} kcal · P${GO[k].p} C${GO[k].c} G${GO[k].f}<br><small>${GO[k].d}</small></button>`).join('')}
<div class="row"><button id="how">¿Cómo jugar?</button></div>`);
document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{au();SFX.click();goal=GO[b.dataset.g];music(230);mode='idle';reset();ups();kitchen()});$('how').onclick=()=>{SFX.click();how()}}
function how(){P(`<h2>¿Cómo jugar?</h2><p>🍞 <b>Carbohidratos = Energía.</b> Llenan tu glucógeno. Si faltan (&lt;35% de la meta) tendrás hipoglucemia y entrenarás a medias.</p><p>🥩 <b>Proteínas = Fuerza y recuperación.</b> Si faltan (&lt;70%) entras en catabolismo y no subes Fuerza.</p><p>🥑 <b>Grasas = Balance y defensa.</b> Regulan hormonas y salud, pero mucha chatarra o más del 130% de las kcal causa pesadez.</p><p>Cada día: 1) arma tu dieta (máx. 4 platos), 2) entrena con la barra de precisión (ESPACIO o clic en la zona verde), 3) resuelve eventos. En el día 15, pelea por turnos.</p><button class="pri" id="bk">Entendido</button>`);$('bk').onclick=()=>{SFX.click();title()}}
function evalDiet(){const g=goal;let k=0,p=0,c=0,f=0,j=0;sel.forEach(i=>{const a=F[i];k+=a[2];p+=a[3];c+=a[4];f+=a[5];if(a[6])j++});
const fl={ok:Math.abs(k/g.k-1)<=.15,hipo:c<g.c*.35,cata:p<g.p*.7,pes:k>g.k*1.3||j>=2};const cl=(a,b)=>Math.max(0,1-Math.abs(a/b-1));
let q=.4*cl(k,g.k)+.25*cl(p,g.p)+.25*cl(c,g.c)+.1*cl(f,g.f);if(fl.ok)q+=.1;if(fl.hipo)q-=.15;if(fl.cata)q-=.1;if(fl.pes)q-=.15;return{k,p,c,f,j,fl,q:Math.max(.05,Math.min(1,q))}}
function kitchen(){mode='idle';act=null;tm=null;sel=[];ups();const g=goal;
P(`<h2>🍳 La Cocina · Día ${day}</h2><p>Meta: <b>${g.k}</b> kcal · P ${g.p}g · C ${g.c}g · G ${g.f}g. Elige hasta 4 platos.</p><div id="fg">${F.map((f,i)=>`<button class="fd" data-i="${i}">${f[0]} <b>${f[1]}</b><br><small>${f[2]} kcal · P${f[3]} C${f[4]} G${f[5]}</small></button>`).join('')}</div><div id="tot"></div><div class="row"><button class="pri" id="go" disabled>Cocinar y guardar dieta</button></div>`);
const upd=()=>{document.querySelectorAll('.fd').forEach(b=>b.classList.toggle('on',sel.includes(+b.dataset.i)));$('go').disabled=!sel.length;if(!sel.length){$('tot').innerHTML='<small>Selecciona tus alimentos…</small>';return}const d=evalDiet();$('tot').innerHTML=`<b>${d.k}</b>/${g.k} kcal · P <b>${d.p}</b>/${g.p} · C <b>${d.c}</b>/${g.c} · G <b>${d.f}</b>/${g.f}`};
document.querySelectorAll('.fd').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,p=sel.indexOf(i);if(p>=0)sel.splice(p,1);else if(sel.length<4)sel.push(i);else SFX.miss();SFX.click();upd()});upd();
$('go').onclick=()=>{D=evalDiet();const f=D.fl;SFX.click();
if(D.c>=g.c*.6)T.c++;if(D.p>=g.p*.85)T.p++;if(D.j>0)T.j++;if(f.ok)T.ok++;
S.ENG=Math.round(S.ENG*.4+(25+75*Math.min(1,D.c/g.c))*.6);if(f.hipo)S.ENG=Math.max(5,S.ENG-12);
if(D.q>.7&&!D.j)gain('HP',3);else if(D.j||f.pes)gain('HP',-4);if(f.hipo)gain('HP',-2);if(!f.cata&&D.p>=g.p*.85)gain('REC',2);if(f.pes)gain('STA',-2);ups();gym()}}
function gym(){const f=D.fl;
P(`<h2>🏋️ El Gimnasio</h2><div>${f.ok?'<span class="tag good">✅ Kcal en rango: bono de rendimiento</span>':'<span class="tag bad">Kcal fuera de ±15%: sin bono</span>'}${f.hipo?'<span class="tag bad">⚠️ Hipoglucemia / Sin energía: ganancias a la mitad</span>':''}${f.cata?'<span class="tag bad">⚠️ Catabolismo: hoy no sube la Fuerza</span>':''}${f.pes?'<span class="tag bad">⚠️ Pesadez: el cardio rinde menos</span>':''}</div><p>Calidad de tu dieta: <b>${Math.round(D.q*100)}%</b> → zona verde ${D.q>.6?'amplia':'pequeña'} y barra ${D.q>.6?'lenta':'rápida'}.</p>
<button class="blk or" data-t="bench">🏋️ Entrenar Fuerza (Press de Banca)</button><button class="blk or" data-t="rope">🪢 Cardio (Cuerda rápida)</button><button class="blk" data-t="rest">😴 Descanso Activo (Estiramientos / Sueño)</button>`);
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{SFX.click();train(b.dataset.t)})}
function train(k){act=k;if(k==='rest'){T.rest++;P('<h2>😴 Descansando…</h2><p>Estiramientos, hidratación y buen sueño.</p>');setTimeout(()=>{gain('REC',6);gain('HP',3);gain('ENG',10);SFX.up();setTimeout(endDay,900)},1800);return}
const w=24+D.q*56;tm={k,pos:0,dir:1,w,z:30,speed:2.6-D.q*1.4,r:0,h:0,sc:0,lock:0};rz();
P(`<h2>${k==='bench'?'Press de Banca':'Cuerda rápida'}</h2><p>Pulsa <b>ESPACIO</b>, haz clic en el canvas o toca el botón cuando el indicador esté en la <span style="color:var(--g)">zona verde</span>. 3 repeticiones.</p><button class="pri blk" id="now">¡AHORA!</button>`);$('now').onclick=press}
function rz(){tm.z=20+Math.random()*(240-tm.w-40)}
function press(){if(!tm||tm.lock)return;const c=tm.z+tm.w/2,d=Math.abs(tm.pos+3-c);if(d<=tm.w/2){tm.sc+=1-d/(tm.w/2)*.5;SFX.hit();SFX.lift();fl('¡Bien!','#39ff6a',150,120)}else{SFX.miss();fl('Fallaste','#ff4d4d',150,120)}
tm.r++;if(tm.r>=3){tm.lock=1;setTimeout(finish,700)}else rz()}
function finish(){const f=D.fl,e=(f.hipo?.5:1)*(S.ENG<35?.7:1)*(f.ok?1.25:1),k=tm.k;tm=null;
if(k==='bench'){if(f.cata){fl('Catabolismo: 0 STR','#ff4d4d',100,70)}else gain('STR',tm0(e))}else gain('STA',tm0(e)*(f.pes?.5:1));gain('ENG',-12);endDay()}
function tm0(e){return Math.round(e*SC*3.2*10)/10}let SC=0;
const _f=finish;finish=function(){SC=tm?tm.sc:0;_f()};
function endDay(){act=null;const d=day;if(EVD.includes(d))return event(EVD.indexOf(d));next()}
function next(){day++;ups();if(day>14)intro();else kitchen()}
function event(i){SFX.alert();const e=EV[i];P(`<h2>${e[0]}</h2><p>${e[1]}</p>`+e[2].map((o,j)=>`<button class="blk" data-o="${j}">${o[0]}</button>`).join(''));
document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const o=e[2][+b.dataset.o];T.evn++;if(o[2])T.ev++;SFX[o[2]?'up':'miss']();for(const k in o[1])gain(k,o[1][k]);
P(`<h2>${o[2]?'✅ Buena decisión':'❌ Mala decisión'}</h2><p><b>${o[0]}</b></p><p>${o[3]}</p><button class="pri" id="c">Continuar</button>`);$('c').onclick=()=>{SFX.click();next()}})}
// ---------- BATALLA ----------
function intro(){mode='battle';music(150);ups();B=null;P(`<h2>🥊 Día 15: ¡Batalla Final!</h2><p>Braulio "El Ciclado" tiene mucha fuerza pero <b>0 resistencia</b>: odia los carbohidratos y el cardio. Agótalo y golpea con inteligencia.</p><p>Golpe de Glucógeno: ${T.c>=8?'<span class="tag good">desbloqueado</span>':`<span class="tag bad">🔒 necesitas 8 días con buenos carbohidratos (tienes ${T.c})</span>`}</p><button class="pri" id="fi">¡Pelear!</button>`);$('fi').onclick=()=>{SFX.click();startB()}}
function startB(){const pe=Math.round(40+S.ENG*.6),ph=Math.round(90+S.HP*1.1);B={ph,hp:ph,pem:pe,pe,bh:130,be:100,busy:0,over:0,log:['¡Suena la campana!']};bpanel()}
const SK=[['Repetición Pesada','Escala con Fuerza',10],['Sprint Metabólico','Escala con Resistencia y Energía; agota a Braulio',15],['Respiración y Técnica','Recupera HP según Salud Metabólica',6],['Golpe de Glucógeno','Ataque definitivo (requiere buen balance de carbos)',30]];
function bpanel(){P(`<h2>Tu turno</h2>`+SK.map((s,i)=>{const lk=i==3&&T.c<8;return`<button class="blk" data-s="${i}" ${B.busy||B.over||lk||B.pe<s[2]?'disabled':''}>${lk?'🔒 ':''}<b>${s[0]}</b> (${s[2]} EN)<br><small>${s[1]}</small></button>`}).join('')+`<div id="log">${B.log.slice(-3).join('<br>')}</div>`);
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>use(+b.dataset.s))}
function hitB(d,big){sh=big?14:8;lg=14;SFX.hit();fl('-'+d,'#ff8a1f',240,85)}
function use(i){if(B.busy||B.over)return;B.busy=1;B.pe-=SK[i][2];let m='',d;
if(i==0){d=Math.round(10+S.STR*.6+Math.random()*4);B.bh-=d;m=`Repetición Pesada: ${d} de daño`;hitB(d)}
if(i==1){d=Math.round(6+(S.STA+S.ENG)*.28+Math.random()*3);B.bh-=d;B.be-=25;m=`Sprint Metabólico: ${d} de daño y Braulio pierde aire`;hitB(d)}
if(i==2){d=Math.round(10+S.HP*.3);B.hp=Math.min(B.ph,B.hp+d);m=`Respiración y Técnica: recuperas ${d} HP`;SFX.up();fl('+'+d+' HP','#39ff6a',90,85)}
if(i==3){d=Math.round(40+S.ENG*.5);B.bh-=d;m=`¡GOLPE DE GLUCÓGENO! ${d} de daño`;hitB(d,1)}
B.log.push(m);bpanel();if(B.bh<=0)return setTimeout(()=>fin(1),900);setTimeout(bturn,1000)}
function bturn(){const ex=B.be<=0,d=Math.round((13+Math.random()*7)*(ex?.45:1)*(1-S.REC/220));B.be=Math.max(0,B.be-18);
if(ex&&Math.random()<.35)B.log.push('Braulio está sin aire y se apoya en las cuerdas: pierde el turno 😮‍💨');else{B.hp-=d;bl=14;sh=-10;SFX.hurt();fl('-'+d,'#ff4d4d',90,85);B.log.push(`Braulio te pega: -${d} HP${ex?' (débil, sin energía)':''}`)}
B.pe=Math.min(B.pem,B.pe+8);if(B.hp<=0)return setTimeout(()=>fin(0),900);B.busy=0;bpanel()}
function fin(w){B.over=1;clearInterval(mus);w?SFX.up():SFX.miss();const g=goal,n=(c,t,ok,bad)=>`<p>${c?'✅':'⚠️'} ${c?ok:bad}</p>`;
P(`<h2>${w?'🏆 ¡VICTORIA!':'💀 Derrota'}</h2><p>${w?'Derrotaste a Braulio: la ciencia le ganó al broscience.':'Braulio resistió esta vez. Revisa tus hábitos y vuelve a intentarlo.'}</p><h2>📋 Reporte Final Nutricional</h2>`+
n(T.c>=10,0,`Carbohidratos: buen nivel en ${T.c}/14 días. Eso mantuvo tu glucógeno y energía.`,`Carbohidratos suficientes solo ${T.c}/14 días. Sin ellos hay hipoglucemia, poca energía y no se desbloquea el Golpe de Glucógeno.`)+
